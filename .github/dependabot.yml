version: 2
updates:
  # Maven dependencies — the root entry recursively covers all submodules via
  # dependabot's transitive POM discovery, so we don't need per-module entries.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # Group patch/minor bumps into a single PR per ecosystem to reduce noise.
      spring:
        patterns:
          - "org.springframework*"
          - "org.springframework.*:*"
          - "io.spring.*:*"
        update-types:
          - "minor"
          - "patch"
      aws-sdk:
        patterns:
          - "software.amazon.awssdk:*"
        update-types:
          - "minor"
          - "patch"
      spring-ai:
        patterns:
          - "org.springframework.ai:*"
        update-types:
          - "minor"
          - "patch"
      test-dependencies:
        patterns:
          - "org.junit*:*"
          - "org.mockito:*"
          - "org.assertj:*"
          - "org.testcontainers:*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions versions in .github/workflows/*
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"

  # Example Dockerfiles — `directories` supports globs so one entry covers all
  # example apps. If you add a Dockerfile outside /examples, extend the list.
  - package-ecosystem: "docker"
    directories:
      - "/examples/*"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
      - "examples"
