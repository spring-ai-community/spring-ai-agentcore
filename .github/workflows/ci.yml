name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'
      - name: Build with Maven
        run: mvn -ntp clean verify
      - name: Check rewrite compliance
        run: mvn -ntp rewrite:dryRun -Dcheckstyle.skip=true -Dlicense.skip=true

  examples:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'
      - name: Install library modules
        run: mvn -ntp clean install -DskipTests
      - name: Build and test examples
        run: mvn -ntp clean verify -f examples/pom.xml
