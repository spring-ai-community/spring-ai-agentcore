name: Dependabot auto-merge

# Enables auto-merge on Dependabot patch/minor Maven bumps. A code owner still
# has to approve; once approved, the merge queue re-runs the required checks
# and merges the PR. Major bumps, spring-ai-session (pre-1.0, breaking minors),
# GitHub Actions and Docker updates stay fully manual.
# Requires the repository setting "Allow auto-merge".

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.package-ecosystem == 'maven'
          && (steps.metadata.outputs.update-type == 'version-update:semver-patch'
            || steps.metadata.outputs.update-type == 'version-update:semver-minor')
          && !contains(steps.metadata.outputs.dependency-names, 'spring-ai-session')
        run: gh pr merge --auto "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
