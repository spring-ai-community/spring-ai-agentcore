# Spring AI Bedrock Configuration
spring.ai.bedrock.converse.chat.options.model=anthropic.claude-3-haiku-20240307-v1:0
spring.ai.bedrock.aws.region=us-east-1

# AgentCore Evaluations Configuration
spring.ai.agentcore.evaluations.enabled=true
spring.ai.agentcore.evaluations.region=us-east-1
spring.ai.agentcore.evaluations.evaluator-ids=Builtin.Helpfulness,Builtin.Correctness,Builtin.Coherence
spring.ai.agentcore.evaluations.async=false
spring.ai.agentcore.evaluations.sample-rate=1.0
spring.ai.agentcore.evaluations.metrics-enabled=true

# Actuator endpoints for metrics
management.endpoints.web.exposure.include=health,metrics,prometheus
