spring.application.name=spring-ai-agentcore-session-example
spring.ai.bedrock.converse.chat.model=global.amazon.nova-2-lite-v1:0

# The AgentCore Memory resource id used by both the ChatMemory and the Session API
# stacks. Set AGENTCORE_MEMORY_ID at runtime to a real memory id you created in AWS.
# A valid memory id AND working AWS credentials are required to actually invoke /api/chat.
agentcore.memory.memory-id=${AGENTCORE_MEMORY_ID:your-memory-id-here}

# Opt in to the Spring AI Session API bean stack (AgentCoreSessionRepository,
# DefaultSessionService, SessionMemoryAdvisor, AgentCoreSessionMemory).
agentcore.memory.session.enabled=true

# Optional short-term configuration shared with the session repository.
agentcore.memory.short-term.total-events-limit=100
agentcore.memory.short-term.default-session=default
agentcore.memory.short-term.page-size=50

# Optional session-scoped tunables. These take precedence over the short-term namespace
# above (session -> short-term -> legacy -> default). Uncomment to configure the session
# repository without touching agentcore.memory.short-term.*.
# agentcore.memory.session.page-size=50
# agentcore.memory.session.total-events-limit=100
# agentcore.memory.session.default-session=default

# Non-destructive branch-swap replaceEvents (opt-in, default false). When true,
# replaceEvents writes the replacement timeline to a fresh gen-* branch and switches the
# current-branch pointer (highest-generation-wins) instead of deleting the old log.
# Migration is one-way per session; prove it out in a non-production environment first.
# agentcore.memory.session.branch-swap-enabled=false
# agentcore.memory.session.delete-superseded-branch=false
# agentcore.memory.session.branch-cache-enabled=false
# agentcore.memory.session.branch-cache-ttl=60s

server.port=8080

logging.level.org.springaicommunity.agentcore.memory=DEBUG
logging.level.org.springframework.ai=INFO
