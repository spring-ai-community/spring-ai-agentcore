spring.application.name=spring-ai-agent-core-memory-example
spring.ai.bedrock.converse.chat.model=global.amazon.nova-2-lite-v1:0

agentcore.memory.memory-id=${AGENTCORE_MEMORY_ID:your-memory-id-here}
agentcore.memory.short-term.total-events-limit=100
agentcore.memory.short-term.default-session=default
agentcore.memory.short-term.page-size=50

server.port=8080

logging.level.org.springaicommunity.agentcore.memory=DEBUG
logging.level.org.springframework.ai=INFO
