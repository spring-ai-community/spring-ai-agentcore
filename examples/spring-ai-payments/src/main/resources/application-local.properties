# Local runs without AgentCore Runtime headers: pay as this user, and use this conversation id, when the
# X-Amzn-Bedrock-AgentCore-Runtime-User-Id / -Session-Id headers are absent. Never use this profile in a deployment,
# otherwise every caller without the header pays from the same wallet.
app.payments.default-user-id=${PAYMENT_USER_ID}
app.payments.default-session-id=local-session
