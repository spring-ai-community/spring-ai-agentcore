spring.application.name=spring-ai-payments

# Bedrock model used by the agent
spring.ai.bedrock.aws.region=us-east-1
spring.ai.bedrock.converse.chat.options.model=global.anthropic.claude-sonnet-4-5-20250929-v1:0

# AgentCore Payments: the payment manager enables the module
agentcore.payments.payment-manager-arn=${PAYMENT_MANAGER_ARN}
agentcore.payments.payment-instrument-id=${PAYMENT_INSTRUMENT_ID}
# Region of the payment manager
app.payments.region=${PAYMENT_REGION:us-east-1}

# paidHttpRequest tool: off by default; the model may only call and pay these hosts
agentcore.payments.paid-http-tool.enabled=true
agentcore.payments.paid-http-tool.allowed-hosts=drvd12nxpcyd5.cloudfront.net,sandbox.node4all.com

# Budget of each conversation, created by PaymentSessionRegistry
agentcore.payments.session.max-spend=0.10
agentcore.payments.session.expiry=30m

# Paid x402 test endpoints (Base Sepolia testnet)
app.market-recap-url=https://drvd12nxpcyd5.cloudfront.net/market-recap
app.fortune-url=https://sandbox.node4all.com/v1/x402-test
